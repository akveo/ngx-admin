<div class="row">
  <div class="col-12">
    <ngx-summary-card
      title="Dashboard overview"
      subtitle="Resumen rápido de los widgets activos"
      [entries]="dashboardSummaryEntries">
    </ngx-summary-card>
  </div>
</div>

<div class="row">
  <div class="col-xxxl-3 col-md-6" *ngFor="let statusCard of statusCards">
    <ngx-status-card [title]="statusCard.title" [type]="statusCard.type">
      <i [ngClass]="statusCard.iconClass"></i>
    </ngx-status-card>
  </div>
</div>

<div class="row">
  <div class="col-12 col-md-6 col-lg-5 col-xxl-4 col-xxxl-3">
    <ngx-temperature></ngx-temperature>
  </div>

  <div class="col-12 col-md-6 col-lg-7 col-xxl-8 col-xxxl-9">
    <ngx-electricity></ngx-electricity>
  </div>
</div>

<div class="row">
  <div class="col-12 col-xl-12 col-xxxl-9">
    <ngx-rooms></ngx-rooms>
  </div>

  <div class="col-12 col-sm-6 col-md-6 col-lg-7 col-xxl-4 col-xxxl-3">
    <ngx-contacts></ngx-contacts>
  </div>

  <div class="col-12 col-sm-6 col-md-6 col-lg-5 col-xxl-4 col-xxxl-3">
    <ngx-solar [chartValue]="solarValue"></ngx-solar>
    <ngx-kitten></ngx-kitten>
  </div>

  <div class="col-12 col-md-5 col-xxxl-3 col-xxl-4">
    <ngx-traffic></ngx-traffic>
    <ngx-weather></ngx-weather>
  </div>

  <div class="col-12 col-md-7 col-xxl-12 col-xxxl-6">
    <ngx-security-cameras></ngx-security-cameras>
  </div>
</div>
